name: Feature request
description: A step, gate, detector, platform or integration you need
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What slows your team down today, with a concrete ticket-shaped example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the factory do? Should it be deterministic (runner) or judgement (skill)?
