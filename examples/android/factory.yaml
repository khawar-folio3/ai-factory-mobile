version: 1

project:
  name: demo-android
  platform: android
  base_branch: develop
  branch_pattern: "bugfix/{key}-{slug}"
  local_only_paths: ["local.properties"]

android:
  app_module: app
  modules: [app, core/ui, feature/profile]
  variant: StagingDebug
  application_id: com.example.demo.staging
  launch_activity: com.example.demo.MainActivity
  avd: Pixel_8_API_35
  deeplink_scheme: demo

autonomy:
  ceiling: 3

tracker:
  kind: jira
  provider: twg                    # each dev's own `twg login`; no Jira token in any file
  site: example.atlassian.net
  projects: [DEMO]
  transitions: {start: "In Progress", review: "In Review"}

guardrail:
  commands: ["./gradlew detekt"]

notifications:
  slack_webhook: "${SLACK_WEBHOOK_URL:-}"   # optional team webhook

viz:
  pixel_agents: true

# GitHub and Jira go through the `gh` and `twg` CLIs; only Figma needs an MCP server, and it needs no token.
mcp_servers:
  figma:
    url: https://mcp.figma.com/mcp
