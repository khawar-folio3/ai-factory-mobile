[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mobile-factory"
version = "0.1.0"
description = "A human-in-the-loop AI factory that takes mobile bugs from ticket to verified draft PR, with risk-based autonomy gates and a code-owner-taste guardrail."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Syed Khawar Hussain" }]
keywords = ["ai", "agents", "android", "ios", "mobile", "code-review", "claude-code", "cursor", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.urls]
Homepage = "https://github.com/khawar-folio3/ai-factory-mobile"
Issues = "https://github.com/khawar-folio3/ai-factory-mobile/issues"

[project.scripts]
factory = "mobile_factory.cli:main"
mobile-factory = "mobile_factory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mobile_factory"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S"]
ignore = [
  "E501",  # the formatter owns line length; long strings stay readable
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
  "S603", "S607",  # subprocess calls are the product: git, gh, adb, gradle
  "B008",          # typer.Option defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
