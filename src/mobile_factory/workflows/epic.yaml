description: An epic, split into stories with acceptance criteria and created under it after approval.
outcome: tickets
artifacts: {plan: split}
steps:
  - {name: preflight, git: false}
  - {name: intake, title: Read ticket}
  - name: split
    title: Split into stories
    kind: agent
    gate: tickets
    scout: true
    task: >-
      Split the epic into stories that each fit one PR and deliver something a user can see or a test can prove. Each
      story gets a summary, a short description and acceptance criteria; order them so each builds on the last.
  - {name: create_tickets, title: Create stories, source: split}
  - {name: handoff, title: Hand-off}
